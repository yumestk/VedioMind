server.port=${SERVER_PORT:9090}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:2048MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:2048MB}

# MyBatis Plus
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# AI providers: set these values through environment variables
ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
ai.siliconflow.api-key=${SILICONFLOW_API_KEY:}
ai.aliyun.api-key=${ALIYUN_API_KEY:}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:3000ms}

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
minio.bucketName=${MINIO_BUCKET_NAME:media}

# Local tools
tool.ytdlp.path=${YTDLP_PATH:/opt/homebrew/bin/yt-dlp}
tool.ffmpeg.dir=${FFMPEG_DIR:/opt/homebrew/bin}
tool.ytdlp.proxy=${YTDLP_PROXY:}

# RocketMQ
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:video-analysis-group}
rocketmq.producer.send-message-timeout=${ROCKETMQ_SEND_TIMEOUT:3000}
